[package]
name = "netorigin"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ipnet = "2.12"
iprange = "0.6"
rayon = "1.12"
reqwest = { version = "0.13", features = ["blocking"] }
scraper = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
strip = true
opt-level = 3
